# ==================== Spring 核心配置 ====================
spring:
  application:
    name: eldercare                              # 应用名称

  # ==================== 数据库配置 ====================
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/eldercare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==================== Redis配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # ==================== Spring AI 配置 ====================
  ai:
    model:
      chat: openai
    openai:
      api-key: ${AGNES_API_KEY}
      base-url: https://apihub.agnes-ai.com/v1
      chat:
        options:
          model: agnes-2.5-flash
          temperature: 0.7

# ==================== 服务器配置 ====================
server:
  port: ${SERVER_PORT:8080}

# ==================== MyBatis配置 ====================
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wmm.eldercare.core.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 日志配置 ====================
logging:
  level:
    com.wmm.eldercare: debug

# ==================== JWT配置 ====================
jwt:
  secret: ${JWT_SECRET:eldercare-secret-key-for-jwt-token-generation-2026}
  access-token-expire-hours: 2
  refresh-token-expire-days: 7

# ==================== 阿里云 OSS 配置 ====================
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET_NAME:wmmya}
    region: cn-beijing
